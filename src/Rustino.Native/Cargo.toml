[package]
name = "rustino_native"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cross-platform native webview library powered by wry and tao"

[lib]
name = "rustino_native"
crate-type = ["cdylib"]

[features]
# macOS: the web inspector in the app (OpenDevTools, right click › Inspect) through a private
# WebKit API, which can get an app rejected from the Mac App Store. Without it, pages of windows
# with devtools enabled can be inspected from Safari's Develop menu.
devtools = ["wry/devtools"]

[dependencies]
tao = "0.34"
wry = "0.55"
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg"] }
rfd = "0.15"
notify-rust = "4"
muda = "0.17"
tray-icon = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WebView2 and WebKitGTK open the web inspector through public APIs
[target.'cfg(not(target_os = "macos"))'.dependencies]
wry = { version = "0.55", features = ["devtools"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
]}
webview2-com = "0.38"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSBundle"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
raw-window-handle = "0.6"
